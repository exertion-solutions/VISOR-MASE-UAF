<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor 3D Layout Equipamiento y Campamento</title>
<style>
  :root{--bg:#0f1720;--panel:#16212d;--line:#2a3a4b;--txt:#e8eef5;--mut:#8da0b3;--red:#e02a2a;--acc:#ffb703}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
  #app{position:fixed;inset:0;display:flex}
  #side{width:270px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}
  #brand{padding:14px 16px;border-bottom:1px solid var(--line)}
  #brand b{font-size:22px;font-style:italic;color:var(--red);letter-spacing:1px;font-weight:900}
  #brand small{display:block;color:var(--mut);font-size:11px;letter-spacing:.5px;margin-top:2px}
  #list{flex:1;overflow:auto;padding:8px}
  .grp{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);padding:10px 8px 4px}
  .item{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .item:hover{background:#1f2f40}
  .item.on{background:#27405a;outline:1px solid var(--acc)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  #main{flex:1;position:relative;min-width:0}
  canvas{display:block}
  #title{z-index:3;position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:800;font-size:20px;letter-spacing:1px;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none}
  #bar{z-index:3;position:absolute;top:48px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:95%}
  button{background:#1c2b3a;color:var(--txt);border:1px solid var(--line);padding:6px 11px;border-radius:6px;cursor:pointer;font:inherit}
  button:hover{border-color:var(--acc)}
  button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
  #info{z-index:4;position:absolute;right:12px;bottom:12px;width:300px;background:rgba(22,33,45,.95);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:none}
  #info h3{color:var(--acc);font-size:15px;margin-bottom:4px}
  #info p{color:var(--txt);font-size:13px}
  #info .t{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  #info .x{position:absolute;top:6px;right:8px;cursor:pointer;color:var(--mut)}
  .lbl{z-index:1;position:absolute;pointer-events:none;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-100%);text-shadow:0 1px 2px #000}
  .lbl.sel{background:var(--acc);color:#111}
  #help{position:absolute;left:12px;bottom:10px;color:#fff;opacity:.7;font-size:11px;pointer-events:none;text-shadow:0 1px 3px #000}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9;color:var(--mut);transition:opacity .5s}
  #menu{display:none;position:absolute;top:10px;left:10px;z-index:6}
  @media(max-width:760px){#side{position:absolute;inset:0 auto 0 0;transform:translateX(-100%);transition:.2s}#side.open{transform:none}#menu{display:block}#title{font-size:14px;left:60px}#info{width:calc(100% - 24px)}}
</style>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="brand"><b>TACKER</b><small>LAY OUT EQUIPAMIENTO Y CAMPAMENTO</small></div>
    <div id="list"></div>
  </aside>
  <div id="main">
    <div id="load">Cargando modelo 3D…</div>
    <button id="menu">☰ Equipos</button>
    <div id="title">LAY OUT EQUIPAMIENTO Y CAMPAMENTO</div>
    <div id="bar">
      <button data-v="iso" class="on">Isométrica</button>
      <button data-v="top">Planta</button>
      <button data-v="front">Frontal</button>
      <button data-v="camp">Campamento</button>
      <button data-v="well">Boca de pozo</button>
      <button data-v="pit">Fosa de quema</button>
      <button id="tLbl" class="on">Etiquetas</button>
      <button id="tFire" class="on">Fuego</button>
      <button id="tQ" class="on">Calidad alta</button>
      <button id="tRot">Rotar</button>
    </div>
    <div id="info"><span class="x" id="ix">✕</span><div class="t" id="it"></div><h3 id="in"></h3><p id="id"></p></div>
    <div id="help">Arrastrar: orbitar · Rueda: zoom · Click derecho: desplazar · Click en equipo: detalle</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {SMAAPass} from 'three/addons/postprocessing/SMAAPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const main = document.getElementById('main');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.3, 700);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;      // conserva rojos/amarillos de seguridad
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
main.insertBefore(renderer.domElement, main.firstChild);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI/2 - 0.02;
controls.minDistance = 3; controls.maxDistance = 220;

// ---------- cielo + IBL + sol ----------
function skyTex(){
  const c=document.createElement('canvas'); c.width=4; c.height=256; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256); gr.addColorStop(0,'#5d8fc7'); gr.addColorStop(.6,'#b5cfe6'); gr.addColorStop(1,'#e8e2d2');
  g.fillStyle=gr; g.fillRect(0,0,4,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
scene.background = skyTex();
scene.fog = new THREE.Fog(0xcfd9df, 150, 380);
{ const pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture; scene.environmentIntensity=0.55; pm.dispose(); }
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
sun.position.set(-60, 90, 70); sun.target.position.set(45,0,0);
sun.castShadow = true; sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-95,right:95,top:60,bottom:-60,near:10,far:260});
sun.shadow.bias=-0.0003; sun.shadow.normalBias=0.03;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x8a7a5e, 0.45));
const fill=new THREE.DirectionalLight(0xbcd2ff,.45); fill.position.set(60,30,-50); scene.add(fill);

// ---------- texturas procedurales ----------
const rnd = (a,b)=>a+Math.random()*(b-a);
function canvasTex(size, draw, srgb=true, rep=[1,1]){
  const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d'); draw(g,size);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]);
  t.anisotropy=renderer.capabilities.getMaxAnisotropy(); if(srgb) t.colorSpace=THREE.SRGBColorSpace; return t;
}
const gravelDraw=(g,s)=>{ g.fillStyle='#9b8e72'; g.fillRect(0,0,s,s);
  for(let i=0;i<9000;i++){ const v=rnd(95,200)|0; g.fillStyle=`rgb(${v},${v-8},${v-30})`; g.beginPath(); g.arc(rnd(0,s),rnd(0,s),rnd(.8,3.2),0,7); g.fill(); }
  for(let i=0;i<40;i++){ g.fillStyle=`rgba(60,45,30,${rnd(.05,.15)})`; g.beginPath(); g.arc(rnd(0,s),rnd(0,s),rnd(15,50),0,7); g.fill(); } };
const gravelMap = canvasTex(1024,gravelDraw,true,[70,40]);
const gravelBump = canvasTex(1024,(g,s)=>{ g.fillStyle='#808080'; g.fillRect(0,0,s,s); for(let i=0;i<9000;i++){ const v=rnd(40,230)|0; g.fillStyle=`rgb(${v},${v},${v})`; g.beginPath(); g.arc(rnd(0,s),rnd(0,s),rnd(.8,3),0,7); g.fill(); } },false,[70,40]);
const padMap = canvasTex(1024,(g,s)=>{ gravelDraw(g,s); g.fillStyle='rgba(190,180,160,.35)'; g.fillRect(0,0,s,s); },true,[40,20]);
function corrugated(color, reps, rough=.55, metal=.35){
  const t=canvasTex(128,(g,s)=>{ for(let i=0;i<16;i++){ const x=i*s/16; const gr=g.createLinearGradient(x,0,x+s/16,0); gr.addColorStop(0,'#fff'); gr.addColorStop(.5,'#9a9a9a'); gr.addColorStop(1,'#fff'); g.fillStyle=gr; g.fillRect(x,0,s/16,s);} },true,[reps,1]);
  return new THREE.MeshStandardMaterial({color, map:t, roughness:rough, metalness:metal, bumpMap:t, bumpScale:1.2});
}
const rustRough = canvasTex(256,(g,s)=>{ g.fillStyle='#999'; g.fillRect(0,0,s,s); for(let i=0;i<500;i++){ const v=rnd(110,230)|0; g.fillStyle=`rgba(${v},${v},${v},.5)`; g.beginPath(); g.arc(rnd(0,s),rnd(0,s),rnd(2,22),0,7); g.fill(); } },false,[2,1]);
const diamond = canvasTex(128,(g,s)=>{ g.fillStyle='#5a5d62'; g.fillRect(0,0,s,s); g.fillStyle='#8c9097'; for(let y=0;y<4;y++)for(let x=0;x<4;x++){ g.save(); g.translate(x*32+16+(y%2?8:0),y*32+16); g.rotate(y%2?.8:-.8); g.fillRect(-9,-2.5,18,5); g.restore(); } },true,[6,6]);

// ---------- materiales ----------
const PH = (c,o={})=>new THREE.MeshPhysicalMaterial(Object.assign({color:c,roughness:.5,metalness:.1},o));
const ST = (c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.3},o));
const C = {
  red:   PH(0xb3201b,{roughness:.45,clearcoat:.35,clearcoatRoughness:.4}),
  redD:  PH(0x7f1713,{roughness:.55,clearcoat:.2,roughnessMap:rustRough}),
  redTank:PH(0xa81d19,{roughness:.55,roughnessMap:rustRough,clearcoat:.15}),
  yel:   PH(0xf2b705,{roughness:.45,clearcoat:.3}),
  steel: ST(0x9a9ea5,{metalness:1,roughness:.32}),
  dark:  ST(0x33363b,{metalness:.6,roughness:.55}),
  galv:  ST(0xa9adb2,{metalness:.9,roughness:.4}),
  white: corrugated(0xf0f0ee,10),
  whiteS:PH(0xececea,{roughness:.5,metalness:.1}),
  green: PH(0x2c7d3b,{roughness:.5}),
  blueP: PH(0x1f5fae,{roughness:.45,clearcoat:.3}),
  pink:  PH(0xe3a0b6,{roughness:.5,clearcoat:.3}),
  waterB:PH(0xa9c4ee,{roughness:.5,clearcoat:.3}),
  purple:PH(0x4a2f80,{roughness:.4,clearcoat:.4}),
  cyan:  PH(0x3aa5dc,{roughness:.4,clearcoat:.4}),
  glass: PH(0x0c141c,{roughness:.05,metalness:.2,clearcoat:1}),
  rubber:ST(0x1a1a1a,{metalness:0,roughness:.9}),
  concrete:ST(0x9b988f,{metalness:0,roughness:.95}),
  fluid: PH(0x1c1710,{roughness:.3,metalness:0,clearcoat:.4}),
  plate: ST(0xffffff,{map:diamond,metalness:.8,roughness:.45}),
  soil:  ST(0x8a6e4c,{metalness:0,roughness:1,map:gravelMap,bumpMap:gravelBump,bumpScale:3}),
  ash:   ST(0x1c1a18,{metalness:0,roughness:1}),
  rock:  ST(0x6a5a48,{metalness:0,roughness:1}),
  brass: ST(0xc9a227,{metalness:1,roughness:.35})
};
C.whiteS.map=null;
const grime=canvasTex(512,(g,s)=>{ g.fillStyle='#ececec'; g.fillRect(0,0,s,s);
  for(let i=0;i<260;i++){ const v=rnd(175,250)|0; g.fillStyle=`rgba(${v},${v},${v},${rnd(.12,.35)})`; g.beginPath(); g.arc(rnd(0,s),rnd(0,s),rnd(4,46),0,7); g.fill(); }
  for(let i=0;i<140;i++){ const x=rnd(0,s),y=rnd(0,s*.7); const gr=g.createLinearGradient(0,y,0,y+rnd(40,230)); gr.addColorStop(0,'rgba(40,30,20,.14)'); gr.addColorStop(1,'rgba(40,30,20,0)'); g.fillStyle=gr; g.fillRect(x,y,rnd(1,4),250); } },true,[1,1]);
const peel=canvasTex(256,(g,s)=>{ g.fillStyle='#808080'; g.fillRect(0,0,s,s); for(let i=0;i<5000;i++){ const v=rnd(90,170)|0; g.fillStyle=`rgb(${v},${v},${v})`; g.fillRect(rnd(0,s),rnd(0,s),1.6,1.6); } },false,[5,5]);
[C.red,C.redD,C.redTank,C.yel,C.whiteS,C.blueP,C.pink,C.waterB,C.purple,C.cyan,C.green].forEach(m=>{ m.map=grime; m.bumpMap=peel; m.bumpScale=.25; if(!m.roughnessMap) m.roughnessMap=rustRough; m.needsUpdate=true; });
const shadowTex=canvasTex(128,(g,s)=>{ const r=g.createRadialGradient(s/2,s/2,s*.12,s/2,s/2,s/2); r.addColorStop(0,'rgba(0,0,0,.6)'); r.addColorStop(.6,'rgba(0,0,0,.25)'); r.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=r; g.fillRect(0,0,s,s); },false);

// ---------- helpers ----------
const mesh=(g,m,x=0,y=0,z=0)=>{ const o=new THREE.Mesh(g,m); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; return o; };
const rb=(w,h,d,m,x,y,z,r=.04)=>mesh(new RoundedBoxGeometry(w,h,d,2,Math.min(r,w/2-.001,h/2-.001,d/2-.001)),m,x,y,z);
const bx=(w,h,d,m,x,y,z)=>mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z);
const cy=(r,h,m,x,y,z,seg=24,r2)=>mesh(new THREE.CylinderGeometry(r2??r,r,h,seg),m,x,y,z);
const cyX=(r,len,m,x,y,z,seg=24)=>{ const o=cy(r,len,m,x,y,z,seg); o.rotation.z=Math.PI/2; return o; };
const cyZ=(r,len,m,x,y,z,seg=24)=>{ const o=cy(r,len,m,x,y,z,seg); o.rotation.x=Math.PI/2; return o; };
const sph=(r,m,x,y,z)=>mesh(new THREE.SphereGeometry(r,20,14),m,x,y,z);
const tor=(R,r,m,x,y,z,rx=Math.PI/2)=>{ const o=mesh(new THREE.TorusGeometry(R,r,8,24),m,x,y,z); o.rotation.x=rx; return o; };
const W=(px,py,y=0)=>new THREE.Vector3((px-330)/14,y,(py-455)/14);

function handwheel(g,x,y,z,col=C.yel,R=.22){ g.add(cy(.035,.45,C.steel,x,y-.1,z,8)); g.add(tor(R,.025,col,x,y+.1,z)); g.add(cy(.04,.05,col,x,y+.1,z,8)); [0,1,2].forEach(i=>{ const s=bx(R*2,.02,.025,col,x,y+.1,z); s.rotation.y=i*Math.PI/3; g.add(s); }); }
function wheel3(g,x,y,z,R,dir='z',col=C.red){
  const w=new THREE.Group();
  w.add(tor(R,.022,col,0,0,0,0)); w.add(cyZ(.045,.08,col,0,0,0,16));
  for(let i=0;i<6;i++){ const sp=bx(R*2-.02,.024,.024,col,0,0,0); sp.rotation.z=i*Math.PI/6; w.add(sp); }
  w.add(cyZ(.03,.07,C.steel,0,0,.04,6));
  w.position.set(x,y,z); if(dir==='x') w.rotation.y=Math.PI/2; else if(dir==='y') w.rotation.x=-Math.PI/2; g.add(w);
}
function gateValve(g,x,y,z,axis='x',col=C.yel){
  const p = axis==='x'?cyX:cyZ;
  g.add(rb(.5,.5,.5,C.red,x,y,z,.08)); g.add(cy(.17,.3,C.red,x,y+.35,z)); handwheel(g,x,y+.55,z,col);
  g.add(p(.28,.1,C.steel,x-.32*(axis==='x'),y,z-.32*(axis==='z'))); g.add(p(.28,.1,C.steel,x+.32*(axis==='x'),y,z+.32*(axis==='z')));
}
function gauge(g,x,y,z){ g.add(cyZ(.12,.06,C.whiteS,x,y,z)); g.add(cyZ(.1,.02,C.glass,x,y,z+.04)); }
function ladder(g,x,z,h,rot=0){
  const L=new THREE.Group();
  [-.25,.25].forEach(s=>L.add(bx(.05,h,.05,C.yel,s,h/2,0)));
  for(let y=.3;y<h;y+=.3) L.add(bx(.5,.03,.03,C.yel,0,y,0));
  L.position.set(x,0,z); L.rotation.y=rot; g.add(L);
}
function rail(g,x1,z1,x2,z2,y,h=1){
  const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz),a=Math.atan2(dz,dx);
  [h*.5,h].forEach(hh=>{ const r=bx(len,.045,.045,C.yel,(x1+x2)/2,y+hh,(z1+z2)/2); r.rotation.y=-a; g.add(r); });
  const n=Math.max(2,Math.round(len/1.6));
  for(let i=0;i<=n;i++){ g.add(bx(.05,h,.05,C.yel,x1+dx*i/n,y+h/2,z1+dz*i/n)); }
}
function label3(text,w,h,fg='#b3201b',bg='#f4f4f4',fs=62){
  const t=canvasTex(256,(g,s)=>{ g.fillStyle=bg; g.fillRect(0,0,s,s); g.fillStyle=fg; g.font=`italic 900 ${fs}px Arial`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,s/2,s/2); });
  return mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:t,roughness:.6}));
}

// bulones de bridas: instanciados por grupo, en coordenadas locales
function flangeAt(g,p,dir,r){
  const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
  const d=cy(r*1.75,.07,C.steel,p.x,p.y,p.z,24); d.quaternion.copy(q); g.add(d);
  const L=(g.userData.bolts=g.userData.bolts||[]);
  for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; L.push({o:new THREE.Vector3(Math.cos(a)*r*1.4,0,Math.sin(a)*r*1.4).applyQuaternion(q).add(p),q}); }
}
function finishBolts(g){
  const L=g.userData.bolts; if(!L||!L.length) return;
  const im=new THREE.InstancedMesh(new THREE.CylinderGeometry(.035,.035,.14,6),C.steel,L.length), m=new THREE.Matrix4(), one=new THREE.Vector3(1,1,1);
  L.forEach((b,i)=>{ m.compose(b.o,b.q,one); im.setMatrixAt(i,m); }); im.castShadow=true; g.add(im); delete g.userData.bolts;
}
function pipe(pts,mat,r=.22,flangeEvery=6.5){
  const g=new THREE.Group();
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],d=b.clone().sub(a),len=d.length(),u=d.clone().normalize();
    const m=mesh(new THREE.CylinderGeometry(r,r,len,16),mat); m.position.copy(a).add(b).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),u); g.add(m);
    if(i>0) g.add(sph(r*1.0,mat,a.x,a.y,a.z));
    const n=Math.floor(len/flangeEvery);
    for(let k=1;k<=n;k++) flangeAt(g,a.clone().addScaledVector(u,len*k/(n+1)),u,r);
  }
  finishBolts(g); scene.add(g); return g;
}

// ---------- registro de equipos ----------
const picks=[], labelsEl=[];
function equip(id,name,group,type,desc,color,pos,labelY,build,rotY=0){
  const g=new THREE.Group(); g.position.copy(pos); g.rotation.y=rotY; build(g); finishBolts(g);
  { const bb=new THREE.Box3().setFromObject(g); const sz=bb.getSize(new THREE.Vector3()), c=bb.getCenter(new THREE.Vector3()).sub(g.position);
    const sh=new THREE.Mesh(new THREE.PlaneGeometry(sz.x*1.25+1.5,sz.z*1.35+1.5),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false,opacity:.85,fog:true}));
    sh.rotation.x=-Math.PI/2; sh.position.set(c.x,.05,c.z); sh.renderOrder=1; sh.raycast=()=>{}; g.add(sh); }
  g.userData={id,name,group,type,desc,color,labelY};
  scene.add(g); picks.push(g);
  const el=document.createElement('div'); el.className='lbl'; el.textContent=name; main.appendChild(el);
  labelsEl.push({el,g}); return g;
}

// ---------- suelo ----------
const gMat=ST(0xffffff,{map:gravelMap,bumpMap:gravelBump,bumpScale:2.2,metalness:0,roughness:1});
const ground=mesh(new THREE.PlaneGeometry(420,220),gMat,45,0,0); ground.rotation.x=-Math.PI/2; ground.castShadow=false; scene.add(ground);

  mound(g,14,5.5,3.4,7.2,0,1);  mound(g,13,4.6,2.6,.6,-6.6,2.3);  mound(g,12,4.4,2.4,1.6,6.8,4.1);  mound(g,4.5,3.4,1.2,-5.8,-5.3,5.2);
  const rg=new THREE.DodecahedronGeometry(1,0), im=new THREE.InstancedMesh(rg,C.rock,46), mm=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),pp=new THREE.Vector3(),sc=new THREE.Vector3();
  for(let i=0;i<46;i++){ const a=rnd(-.4,3.5); const R=rnd(4.4,6.2); pp.set(Math.cos(a)*R*1.05+1,rnd(.1,.5),Math.sin(a)*R); const k=rnd(.2,.55); sc.set(k,k*rnd(.5,.9),k); e.set(rnd(0,3),rnd(0,3),rnd(0,3)); q.setFromEuler(e); mm.compose(pp,q,sc); im.setMatrixAt(i,mm); }
  im.castShadow=im.receiveShadow=true; g.add(im);
  // línea de ensayo (violeta) hasta el cabezal quemador
  g.add(cyX(.24,2.0,C.purple,-2.2,Y,2.0)); flangeAt(g,new THREE.Vector3(-1.9,Y,2.0),new THREE.Vector3(1,0,0),.24);
  [-2.6,-1.5].forEach(x=>{ [-1,1].forEach(sz=>{ const l=bx(.1,1.15,.1,C.dark,x,.55,2.0+sz*.45); l.rotation.x=-sz*.35; g.add(l); }); });
  g.add(cyX(.5,1.4,burnerMat,-.4,Y,2.0,28)); g.add(cyX(.54,.12,burnerMat,.32,Y,2.0,28)); g.add(cyX(.35,.05,burnerMat,.4,Y,2.0,20));
  for(let i=0;i<14;i++){ const a=i/14*Math.PI*2; g.add(cyX(.06,.05,C.dark,-.4,Y+Math.cos(a)*.5,2.0+Math.sin(a)*.5,8)); }
  // línea de pileta de ensayo (celeste) con boquilla
  g.add(cyX(.2,2.2,C.cyan,-3.4,Y,-1.3)); g.add(cy(.2,.8,C.cyan,-2.3,Y+.4,-1.3,14)); g.add(sph(.22,C.cyan,-2.3,Y+.8,-1.3));
  g.add(cy(.26,.4,burnerMat,-2.3,Y+.8,-1.3,14).translateY(.2));
  fireG.position.set(.5,Y,2.0); g.add(fireG);
});
const flameTex=canvasTex(128,(g,z)=>{ const gr=g.createRadialGradient(z/2,z*.64,2,z/2,z*.64,z*.5); gr.addColorStop(0,'rgba(255,240,150,1)'); gr.addColorStop(.25,'rgba(255,190,30,.98)'); gr.addColorStop(.55,'rgba(245,95,0,.8)'); gr.addColorStop(1,'rgba(170,25,0,0)'); g.fillStyle=gr; g.fillRect(0,0,z,z); });
const flames=[];
for(let i=0;i<14;i++){ const h=rnd(4.5,10),w=rnd(1.4,3.2); const f=new THREE.Sprite(new THREE.SpriteMaterial({map:flameTex,transparent:true,blending:THREE.NormalBlending,depthWrite:false,fog:false,opacity:rnd(.8,1)}));
  f.position.set(0,h/2,0); f.userData={h,w,x0:rnd(-.4,.6),z0:rnd(-.5,.5),ph:Math.random()*10,sp:3+Math.random()*5}; fireG.add(f); flames.push(f); }
const smokeTex=canvasTex(64,(g,s)=>{ const r=g.createRadialGradient(s/2,s/2,2,s/2,s/2,s/2); r.addColorStop(0,'rgba(150,150,150,.5)'); r.addColorStop(1,'rgba(150,150,150,0)'); g.fillStyle=r; g.fillRect(0,0,s,s); });
const smoke=[]; for(let i=0;i<14;i++){ const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,depthWrite:false,depthTest:true,fog:false,color:0xb8b8b8})); sp.userData={ph:i/14}; if(i%2) sp.material.color.set(0xffffff); fireG.add(sp); smoke.push(sp); }
const sparkG=new THREE.BufferGeometry(); const sparkN=60; sparkG.setAttribute('position',new THREE.BufferAttribute(new Float32Array(sparkN*3),3));
const sparks=new THREE.Points(sparkG,new THREE.PointsMaterial({color:0xffc060,size:.18,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false})); sparks.frustumCulled=false; fireG.add(sparks);
const sparkD=Array.from({length:sparkN},()=>({t:Math.random()*3,vx:rnd(-.6,.6),vz:rnd(-.6,.6),vy:rnd(2,5)}));
const fireLight=new THREE.PointLight(0xff7a1a,60,32,1.6); fireLight.position.set(pitC.x+1.5,4,pitC.z+2); scene.add(fireLight);

// ================== TUBERÍAS ==================
const pipes=new THREE.Group(); scene.add(pipes);
pipe([new THREE.Vector3(wellP.x+1.0,Y,wellP.z),W(493.3,455,Y)],C.red,.2);
pipe([W(522.7,455,Y),W(630.7,455,Y)],C.red,.2);

pipe([W(900,455,Y),W(900,438,Y),W(985,300,Y),W(1052,280,Y)],C.red,.2);                    // -> pileta con tornillo (entrada)
pipe([W(900,455,Y),W(900,505,Y),W(960,570,Y),W(982.4,578,Y)],C.red,.2);                   // -> choke manifold (entrada)

pipe([W(1030+3.4*14,578,Y),W(1300,578,Y),W(1510,578,Y)],C.purple,.24,5);                  // choke -> fosa (cabezal quemador)
pipe([W(1379.5,465,Y),W(1470,512,Y),W(1492,531.8,Y)],C.cyan,.2);                           // pileta de ensayo -> fosa
// líneas de señal / cables
function dashed(pts,color,dash=.5,gap=.35){ const g=new THREE.BufferGeometry().setFromPoints(pts); const l=new THREE.Line(g,new THREE.LineDashedMaterial({color,dashSize:dash,gapSize:gap})); l.computeLineDistances(); scene.add(l); }
// Líneas hidráulicas de accionamiento: command center -> actuadores (punteadas)
const hydMat=new THREE.MeshStandardMaterial({color:0x2a7de1,roughness:.4,metalness:.3,emissive:0x0a3d7a});
function hyd(pts){
  const dg=new THREE.CylinderGeometry(.04,.04,1,6),list=[];
  for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1],d=b.clone().sub(a),len=d.length(),u=d.clone().normalize(),q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),u);
    for(let k=0;k<len;k+=.9){ const l=Math.min(.55,len-k); if(l<.05) break; list.push({p:a.clone().addScaledVector(u,k+l/2),q,l}); } }
  const im=new THREE.InstancedMesh(dg,hydMat,list.length),m=new THREE.Matrix4(),one=new THREE.Vector3(1,1,1);
  list.forEach((o,i)=>{ m.compose(o.p,o.q,one.set(1,o.l,1)); im.setMatrixAt(i,m); }); scene.add(im);
  [pts[0],pts[pts.length-1]].forEach(e=>{ const f=sph(.1,hydMat,e.x,e.y,e.z); f.castShadow=false; scene.add(f); });
}
{ const cc=W(775,745), wz=cc.z-1.4, V=(x,y,z)=>new THREE.Vector3(x,y,z), gy=.12;
  const ssv=W(508,455), plug=W(665,455), des=W(848,455), chk=W(1030,578);
  // distribuidor sobre la pared norte del command center
  { const bxm=bx(4.4,.5,.14,C.steel,cc.x,.85,wz-.08); scene.add(bxm); }
  const xs=[-1.6,-.5,.5,1.6].map(o=>cc.x+o);
  hyd([V(xs[0],.85,wz-.15),V(xs[0],gy,wz-.6),V(xs[0],gy,16),V(ssv.x-.5,gy,16),V(ssv.x-.5,gy,ssv.z+.45),V(ssv.x-.5,1.6,ssv.z+.45)]);       // SSV (actuador)
  hyd([V(xs[1],.85,wz-.15),V(xs[1],gy,wz-.6),V(xs[1],gy,15),V(plug.x-.3,gy,15),V(plug.x-.3,gy,plug.z+.3),V(plug.x-.3,1.0,plug.z+.3)]);         // plug catcher (válvulas)
  hyd([V(xs[2],.85,wz-.15),V(xs[2],gy,wz-.6),V(xs[2],gy,14),V(des.x,gy,14),V(des.x,gy,des.z+.3),V(des.x,1.5,des.z+.3)]);                       // desander (válvulas)
  hyd([V(xs[3],.85,wz-.15),V(xs[3],gy,wz-.6),V(xs[3],gy,17.3),V(chk.x-.5,gy,17.3),V(chk.x-.5,gy,chk.z+1.27),V(chk.x-.5,1.0,chk.z+1.27)]);      // choke manifold (válvulas)
}
dashed([W(1520,640,.15),W(1520,800,.15),W(1220,800,.15)],0x444444);

// ---------- UI ----------
const listEl=document.getElementById('list'),groups={};
picks.forEach(g=>(groups[g.userData.group]=groups[g.userData.group]||[]).push(g));
Object.keys(groups).forEach(k=>{
  const h=document.createElement('div'); h.className='grp'; h.textContent=k; listEl.appendChild(h);
  groups[k].forEach(g=>{ const d=document.createElement('div'); d.className='item'; d.dataset.id=g.userData.id;
    d.innerHTML=`<span class="dot" style="background:#${g.userData.color.toString(16).padStart(6,'0')}"></span>${g.userData.name}`;
    d.onclick=()=>{ select(g,true); document.getElementById('side').classList.remove('open'); }; listEl.appendChild(d); });
});
const info=document.getElementById('info'); const selBox=new THREE.Box3Helper(new THREE.Box3(),0xffb703); selBox.visible=false; scene.add(selBox);
function select(g,fly){
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',!!g&&e.dataset.id===g.userData.id));
  labelsEl.forEach(l=>l.el.classList.toggle('sel',l.g===g));
  if(!g){ info.style.display='none'; selBox.visible=false; return; }
  const u=g.userData; it.textContent=u.group+' · '+u.type; inn.textContent=u.name; idd.textContent=u.desc; info.style.display='block';
  const bb=new THREE.Box3().setFromObject(g); selBox.box.copy(bb); selBox.visible=true;
  if(fly){ const c=bb.getCenter(new THREE.Vector3()), r=Math.max(bb.getSize(new THREE.Vector3()).length()*.9,12); flyTo(c.clone().add(new THREE.Vector3(r*.55,r*.5,r*.8)),c); }
}
const it=document.getElementById('it'),inn=document.getElementById('in'),idd=document.getElementById('id');
document.getElementById('ix').onclick=()=>select(null);
const VIEWS={
  iso:[new THREE.Vector3(-25,60,100),new THREE.Vector3(42,0,2)],
  top:[new THREE.Vector3(44,150,14),new THREE.Vector3(44,0,-1)],
  front:[new THREE.Vector3(42,20,105),new THREE.Vector3(42,3,0)],
  camp:[new THREE.Vector3(-38,22,18),new THREE.Vector3(-14,2,0)],
  well:[wellP.clone().add(new THREE.Vector3(2.5,2.6,7)),wellP.clone().add(new THREE.Vector3(0,1.7,0))],
  pit:[pitC.clone().add(new THREE.Vector3(-18,14,26)),pitC.clone().setY(2.5)]
};
let anim=null; function flyTo(p,t){ anim={t:0,p0:camera.position.clone(),t0:controls.target.clone(),p1:p,t1:t}; }
document.querySelectorAll('#bar [data-v]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#bar [data-v]').forEach(x=>x.classList.toggle('on',x===b)); flyTo(...VIEWS[b.dataset.v]); });
let showL=true,showF=true,hq=!matchMedia('(pointer:coarse)').matches;
const tLbl=document.getElementById('tLbl'),tFire=document.getElementById('tFire'),tRot=document.getElementById('tRot'),tQ=document.getElementById('tQ');
tQ.classList.toggle('on',hq);
tLbl.onclick=()=>{ showL=!showL; tLbl.classList.toggle('on',showL); };
tFire.onclick=()=>{ showF=!showF; tFire.classList.toggle('on',showF); fireG.visible=showF; fireLight.visible=showF; };
tRot.onclick=()=>{ controls.autoRotate=!controls.autoRotate; controls.autoRotateSpeed=1.2; tRot.classList.toggle('on',controls.autoRotate); };
tQ.onclick=()=>{ hq=!hq; tQ.classList.toggle('on',hq); };
document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(); let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{ down=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5) return;
  const r=renderer.domElement.getBoundingClientRect(); mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mouse,camera); const hit=ray.intersectObjects(picks,true)[0];
  if(!hit){ select(null); return; } let o=hit.object; while(o&&!o.userData.id) o=o.parent; select(o,false);
});

// ---------- postproceso ----------
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const gtao=new GTAOPass(scene,camera,innerWidth,innerHeight); gtao.updateGtaoMaterial({radius:.7,distanceExponent:1.2,thickness:1.5,scale:1.3,samples:12}); gtao.blendIntensity=.9; composer.addPass(gtao);
{ const go=gtao.render.bind(gtao); gtao.render=function(...a){ const v=fireG.visible; fireG.visible=false; go(...a); fireG.visible=v; }; }
composer.addPass(new OutputPass()); composer.addPass(new SMAAPass(innerWidth,innerHeight));
function resize(){ const w=main.clientWidth,h=main.clientHeight; renderer.setSize(w,h); composer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
camera.position.copy(VIEWS.iso[0]); controls.target.copy(VIEWS.iso[1]);

// ---------- loop ----------
const clock=new THREE.Clock(),tmp=new THREE.Vector3(); let first=true;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.1),t=clock.elapsedTime;
  if(anim){ anim.t=Math.min(1,anim.t+dt/1.3); const k=anim.t<.5?2*anim.t*anim.t:1-Math.pow(-2*anim.t+2,2)/2;
    camera.position.lerpVectors(anim.p0,anim.p1,k); controls.target.lerpVectors(anim.t0,anim.t1,k); if(anim.t>=1) anim=null; }
  if(showF){
    flames.forEach(f=>{ const u=f.userData,k=.78+.3*Math.sin(t*u.sp+u.ph)+.1*Math.sin(t*13+u.ph*2); f.scale.set(u.w*(1+.18*Math.sin(t*7+u.ph)),u.h*k,1); f.position.set(u.x0+u.h*k*.26+Math.sin(t*3+u.ph)*.15,.4+u.h*k*.44,u.z0); });
    smoke.forEach(s=>{ const p=(t*.12+s.userData.ph)%1; s.position.set(1+p*9+Math.sin(p*5+s.userData.ph*9)*.8,3+p*10,Math.cos(p*4+s.userData.ph*7)*1.2); s.scale.setScalar(2+p*7); s.material.opacity=Math.sin(p*Math.PI)*(s.userData.ph*14%2<1?.28:.4); });
    const pa=sparkG.attributes.position; sparkD.forEach((d,i)=>{ d.t+=dt; if(d.t>3){ d.t=0; d.vx=rnd(-.6,.6); d.vz=rnd(-.6,.6); d.vy=rnd(2,5); } pa.setXYZ(i,d.vx*d.t*2,1+d.vy*d.t-.6*d.t*d.t*.5,d.vz*d.t*2); }); pa.needsUpdate=true;
    fireLight.intensity=55+Math.sin(t*20)*9+Math.sin(t*13)*6;
  }
  controls.update();
  if(hq) composer.render(); else renderer.render(scene,camera);
  const w=main.clientWidth,h=main.clientHeight;
  labelsEl.forEach(({el,g})=>{
    if(!showL){ el.style.display='none'; return; }
    tmp.copy(g.position); tmp.y=g.userData.labelY; tmp.project(camera);
    if(tmp.z>1){ el.style.display='none'; return; }
    el.style.display='block'; el.style.left=((tmp.x+1)/2*w)+'px'; el.style.top=((1-tmp.y)/2*h)+'px';
  });
  if(first){ first=false; const l=document.getElementById('load'); l.style.opacity=0; setTimeout(()=>l.remove(),600); }
}
loop();
window.__scene={scene,camera,controls,picks,renderer};
